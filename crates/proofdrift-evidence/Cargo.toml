[package]
name = "proofdrift-evidence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tamper-evident local evidence store and .proofdrift bundle implementation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
