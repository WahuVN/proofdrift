name: release-artifacts
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked release binary
        run: cargo build --locked --release -p proofdrift-cli
      - name: Package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/proofdrift dist/proofdrift
          chmod +x dist/proofdrift
          (cd dist && shasum -a 256 proofdrift > proofdrift.sha256)
      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/proofdrift.exe dist/proofdrift.exe
          $hash = (Get-FileHash dist/proofdrift.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  proofdrift.exe" | Set-Content -Encoding ascii dist/proofdrift.exe.sha256
      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@v4
        with:
          name: proofdrift-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error

# Source publication does not imply a signed binary release. Signing and
# release publication are enabled only after the signing identity is configured.
