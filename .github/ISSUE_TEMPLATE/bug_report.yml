name: Bug report
description: Report a reproducible ProofDrift defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private repository content. Security vulnerabilities belong in private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, inputs or public fixture needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProofDrift version
      placeholder: proofdrift 0.0.1
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Redact secrets and private paths before pasting logs or JSON.
