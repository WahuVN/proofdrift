[package]
name = "proofdrift-schema"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Canonical data contracts and deterministic hashing for ProofDrift/ProofDrift."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
