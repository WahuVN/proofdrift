name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-10
        with:
          toolchain: stable
      - name: Test workspace
        run: cargo test --locked --workspace

  msrv:
    name: msrv (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-10
        with:
          toolchain: 1.89.0
      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace

  action-smoke:
    name: github-action-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Run local composite action
        id: proofdrift
        uses: ./integrations/github-action
        with:
          base: HEAD^
          head: HEAD
          strict: 'false'
      - name: Verify action report outputs
        shell: bash
        run: |
          test -f '${{ steps.proofdrift.outputs.scan-report-path }}'
          test -f '${{ steps.proofdrift.outputs.patch-report-path }}'

  ci-success:
    name: ci-success
    if: always()
    needs: [quality, test, msrv, action-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        shell: bash
        run: |
          test '${{ needs.quality.result }}' = 'success'
          test '${{ needs.test.result }}' = 'success'
          test '${{ needs.msrv.result }}' = 'success'
          test '${{ needs.action-smoke.result }}' = 'success'
