name: ProofDrift report
description: Builds ProofDrift from the checked-out action source and runs report-only scan/patch checks by default.
inputs:
  base:
    description: Git base revision for patch analysis.
    required: false
    default: HEAD^
  head:
    description: Git head revision for patch analysis.
    required: false
    default: HEAD
  strict:
    description: When true, propagate ProofDrift risk exit codes instead of report-only success.
    required: false
    default: 'false'
outputs:
  scan-exit-code:
    description: Exit code returned by ProofDrift scan.
    value: ${{ steps.run.outputs.scan_code }}
  patch-exit-code:
    description: Exit code returned by ProofDrift patch.
    value: ${{ steps.run.outputs.patch_code }}
runs:
  using: composite
  steps:
    - name: Build ProofDrift CLI
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: cargo build --locked --release -p proofdrift-cli
    - id: run
      name: Generate ProofDrift report
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        set +e
        BIN="${GITHUB_ACTION_PATH}/../../target/release/proofdrift"
        if [ "${RUNNER_OS}" = "Windows" ]; then BIN="${BIN}.exe"; fi
        "${BIN}" --json scan "${GITHUB_WORKSPACE}" > "${RUNNER_TEMP}/proofdrift-scan.json"
        scan_code=$?
        (cd "${GITHUB_WORKSPACE}" && "${BIN}" --json patch --base "${INPUT_BASE}" --head "${INPUT_HEAD}") > "${RUNNER_TEMP}/proofdrift-patch.json"
        patch_code=$?
        echo "scan_code=${scan_code}" >> "${GITHUB_OUTPUT}"
        echo "patch_code=${patch_code}" >> "${GITHUB_OUTPUT}"
        {
          echo '## ProofDrift report'
          echo
          echo "- scan exit code: ${scan_code}"
          echo "- patch exit code: ${patch_code}"
          echo "- mode: $([ "${INPUT_STRICT}" = "true" ] && echo strict || echo report-only)"
          echo
          echo 'Full JSON outputs remain local to the job temp directory unless the calling workflow explicitly uploads them.'
        } >> "${GITHUB_STEP_SUMMARY}"
        if [ "${INPUT_STRICT}" = "true" ]; then
          if [ "${scan_code}" -ne 0 ]; then exit "${scan_code}"; fi
          if [ "${patch_code}" -ne 0 ]; then exit "${patch_code}"; fi
        fi
        exit 0
