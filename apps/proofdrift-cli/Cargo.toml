[package]
name = "proofdrift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "proofdrift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
walkdir = "2"
thiserror = "2"
proofdrift-schema = { path = "../../crates/proofdrift-schema" }
proofdrift-core = { path = "../../crates/proofdrift-core" }
proofdrift-discover = { path = "../../crates/proofdrift-discover" }
proofdrift-scan = { path = "../../crates/proofdrift-scan" }
proofdrift-policy = { path = "../../crates/proofdrift-policy" }
proofdrift-runtime = { path = "../../crates/proofdrift-runtime" }
proofdrift-mcp-proxy = { path = "../../crates/proofdrift-mcp-proxy" }
proofdrift-patch = { path = "../../crates/proofdrift-patch" }
proofdrift-provenance = { path = "../../crates/proofdrift-provenance" }
proofdrift-evidence = { path = "../../crates/proofdrift-evidence" }
tokio = { version = "1", features = ["rt", "process", "time", "io-util"] }

[lints]
workspace = true
