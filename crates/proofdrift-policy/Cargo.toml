[package]
name = "proofdrift-policy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic Cedar-backed policy evaluation and approval semantics for ProofDrift"

[dependencies]
cedar-policy = { version = "=4.12.0", default-features = false }
proofdrift-capabilities = { path = "../proofdrift-capabilities" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[[bench]]
name = "policy_eval"
harness = false
