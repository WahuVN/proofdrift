[package]
name = "proofdrift-runtime"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
