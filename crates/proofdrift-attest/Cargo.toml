[package]
name = "proofdrift-attest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Attestation and receipt adapters for ProofDrift evidence"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
