[package]
name = "proofdrift-core"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Core trust lifecycle, stores, report aggregation, and deterministic trust diff."

[dependencies]
proofdrift-schema = { path = "../proofdrift-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
